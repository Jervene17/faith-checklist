<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Faith Checklist</title>
<meta name="description" content="A daily, weekly, monthly and yearly faith practice tracker." />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#F6F1E7" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Faith Checklist" />
<style>html,body{margin:0;padding:0;background:#F6F1E7;}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body><style>
  #faith-tracker-root {
    --bg: #F6F1E7;
    --ink: #232042;
    --accent: #D9A441;
    --success: #6B8F5E;
    --muted: #8A8375;
    --line: #DDD3BE;
    --card: #FBF8F1;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--bg);
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    box-sizing: border-box;
    min-height: 100%;
  }
  #faith-tracker-root * { box-sizing: border-box; }

  .ft-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
  }
  .ft-header h1 {
    font-family: Iowan Old Style, Palatino Linotype, Georgia, serif;
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 2px;
    letter-spacing: 0.2px;
  }
  .ft-header .ft-sub {
    color: var(--muted);
    font-size: 13px;
  }
  .ft-sun {
    width: 26px; height: 26px; flex-shrink: 0;
  }

  .ft-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .ft-tab {
    flex: 1;
    background: none;
    border: none;
    font-size: 14px;
    font-family: inherit;
    color: var(--muted);
    padding: 9px 4px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .ft-tab.active {
    color: var(--ink);
    border-bottom: 2px solid var(--accent);
    font-weight: 600;
  }

  .ft-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .ft-nav button {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 6px;
    width: 32px; height: 32px;
    font-size: 15px;
    cursor: pointer;
  }
  .ft-nav button:active { background: var(--line); }
  .ft-nav .ft-range {
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    flex: 1;
  }
  .ft-nav .ft-today-btn {
    width: auto;
    padding: 0 10px;
    font-size: 12px;
    color: var(--muted);
    margin-left: 6px;
  }

  .ft-section {
    margin-bottom: 22px;
  }
  .ft-section-title {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 8px;
  }

  .ft-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
    gap: 10px;
  }
  .ft-row:last-child { border-bottom: none; }
  .ft-row-label {
    font-size: 14.5px;
    flex: 1;
  }
  .ft-row-hint {
    display: block;
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 2px;
  }

  .ft-check {
    width: 22px; height: 22px;
    border: 1.5px solid var(--muted);
    border-radius: 5px;
    background: var(--card);
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
  }
  .ft-check.checked {
    background: var(--success);
    border-color: var(--success);
  }
  .ft-check.checked::after {
    content: "";
    position: absolute;
    left: 6px; top: 2px;
    width: 6px; height: 11px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }

  .ft-num {
    width: 56px;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    background: var(--card);
    color: var(--ink);
    text-align: center;
  }
  .ft-stepper {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .ft-stepper button {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ft-stepper button:active { background: var(--line); }
  .ft-stepper button:disabled { opacity: 0.35; cursor: default; }
  .ft-stepper button.ft-step-plus {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .ft-stepper .ft-step-val {
    min-width: 20px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
  }
  .ft-text {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 13.5px;
    font-family: inherit;
    background: var(--card);
    color: var(--ink);
  }
  textarea.ft-text { min-height: 56px; resize: vertical; }

  .ft-progress-wrap {
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 8px;
  }
  .ft-progress-bar {
    height: 100%;
    background: var(--accent);
  }
  .ft-progress-label {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 5px;
  }

  .ft-stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .ft-stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
  }
  .ft-stat-num {
    font-family: Iowan Old Style, Palatino Linotype, Georgia, serif;
    font-size: 22px;
    font-weight: 600;
    line-height: 1;
  }
  .ft-stat-label {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 4px;
  }

  .ft-champion {
    border-left: 3px solid var(--accent);
    padding: 8px 0 8px 12px;
    margin-bottom: 8px;
    font-size: 13.5px;
  }
  .ft-champion .ft-champ-cat { color: var(--muted); font-size: 11.5px; display:block; margin-bottom:2px; }
  .ft-champion.ft-champ-leading { border-left-color: var(--success); }

  .ft-empty {
    color: var(--muted);
    font-size: 13.5px;
    padding: 20px 0;
    text-align: center;
  }

  .ft-settings-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 14px;
  }
  .ft-settings-line input {
    width: 50px;
    padding: 4px 6px;
    border: 1px solid var(--line);
    border-radius: 5px;
    font-size: 12.5px;
    text-align: center;
    background: var(--card);
    color: var(--ink);
  }

  .ft-loading { color: var(--muted); font-size: 13.5px; padding: 30px 0; text-align: center; }

  #faith-auth-root {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #F6F1E7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
  }
  .ft-auth-card {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .ft-auth-card h1 {
    font-family: Iowan Old Style, Palatino Linotype, Georgia, serif;
    font-size: 24px;
    color: #232042;
    margin: 0 0 2px;
    text-align: center;
  }
  .ft-auth-sub {
    color: #8A8375;
    font-size: 13px;
    text-align: center;
    margin: 0 0 10px;
  }
  .ft-auth-card input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #DDD3BE;
    border-radius: 7px;
    font-size: 15px;
    font-family: inherit;
    background: #FBF8F1;
    color: #232042;
    box-sizing: border-box;
  }
  .ft-auth-primary {
    background: #D9A441;
    border: none;
    color: white;
    font-weight: 600;
    font-size: 14.5px;
    padding: 12px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
  }
  .ft-auth-secondary {
    background: none;
    border: 1px solid #DDD3BE;
    color: #232042;
    font-size: 14px;
    padding: 11px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
  }
  .ft-auth-link {
    background: none;
    border: none;
    color: #8A8375;
    font-size: 12.5px;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px 0;
    font-family: inherit;
  }
  .ft-auth-error {
    color: #B5514A;
    font-size: 12.5px;
    min-height: 16px;
    text-align: center;
  }

  .ft-backup-bar {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-bottom: 14px;
  }
  .ft-backup-bar button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 11.5px;
    font-family: inherit;
    text-decoration: underline;
    cursor: pointer;
    padding: 2px 0;
  }

  .ft-reminder-bar {
    margin-bottom: 14px;
  }
  .ft-reminder-bar button {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 12.5px;
    font-family: inherit;
    border-radius: 7px;
    padding: 8px 10px;
    cursor: pointer;
    text-align: left;
  }
  .ft-reminder-bar button.ft-reminder-on {
    border-color: var(--success);
    color: var(--success);
  }

  .ft-tab { font-size: 13px; padding: 9px 2px; }

  .ft-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .ft-pill {
    background: var(--card); border: 1px solid var(--line); color: var(--ink);
    border-radius: 999px; padding: 5px 12px; font-size: 12.5px;
    font-family: inherit; cursor: pointer;
  }
  .ft-pill.active { background: var(--ink); border-color: var(--ink); color: #fff; }

  .ft-badge-row { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .ft-badge-row:last-child { border-bottom: none; }
  .ft-badge-name { font-weight: 600; display: block; }
  .ft-badge-row.mine .ft-badge-name { color: var(--success); }
  .ft-badge-winner { color: var(--muted); font-size: 12.5px; }

  .ft-btn {
    background: var(--card); border: 1px solid var(--line); color: var(--ink);
    border-radius: 7px; padding: 8px 12px; font-size: 13px;
    font-family: inherit; cursor: pointer;
  }
  .ft-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .ft-btn:disabled { opacity: 0.5; }
  .ft-note { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 6px 0; }
  .ft-inline { display: flex; gap: 8px; margin-top: 8px; }
  .ft-inline input { flex: 1; }
  .ft-stack { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .ft-msg { color: #B5514A; font-size: 12.5px; min-height: 16px; }
  .ft-link {
    background: none; border: none; color: var(--muted); text-decoration: underline;
    font-size: 11.5px; cursor: pointer; font-family: inherit; padding: 2px 0;
  }
  .ft-diary-entry { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .ft-diary-date { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .ft-diary-text { font-size: 14px; white-space: pre-wrap; line-height: 1.5; }
  .ft-big-title {
    font-family: Iowan Old Style, Palatino Linotype, Georgia, serif;
    font-size: 19px; font-weight: 600; margin: 4px 0 4px;
  }
</style>
<div id="faith-auth-root">
  <div class="ft-auth-card">
    <h1>Faith Checklist</h1>
    <p class="ft-auth-sub">Sign in to keep your record synced across devices.</p>
    <input type="text" id="ft-auth-name" class="ft-text" placeholder="Display name (only needed to create an account)" autocomplete="name" />
    <input type="email" id="ft-auth-email" class="ft-text" placeholder="Email" autocomplete="email" />
    <input type="password" id="ft-auth-password" class="ft-text" placeholder="Password" autocomplete="current-password" />
    <div class="ft-auth-error" id="ft-auth-error"></div>
    <button id="ft-auth-login-btn" type="button" class="ft-auth-primary">Log in</button>
    <button id="ft-auth-signup-btn" type="button" class="ft-auth-secondary">Create an account</button>
    <button id="ft-auth-reset-btn" type="button" class="ft-auth-link">Forgot password?</button>
  </div>
</div>

<div id="faith-tracker-root" style="display:none;">
  <div class="ft-header">
    <div>
      <h1>Faith Checklist</h1>
      <div class="ft-sub" id="ft-header-sub">Loading…</div>
    </div>
    <svg class="ft-sun" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="14" r="5" fill="#D9A441"/>
      <path d="M12 3v3M4.2 8.2l2.1 2.1M19.8 8.2l-2.1 2.1M2 15h3M19 15h3" stroke="#D9A441" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="ft-backup-bar" id="ft-account-bar">
    <span id="ft-account-email" style="font-size:11.5px; color:var(--muted); margin-right:auto;"></span>
    <button id="ft-logout-btn" type="button">Log out</button>
  </div>

  <div class="ft-tabs" id="ft-tabs">
    <button class="ft-tab active" data-tab="today">Today</button>
    <button class="ft-tab" data-tab="week">Week</button>
    <button class="ft-tab" data-tab="month">Month</button>
    <button class="ft-tab" data-tab="year">Year</button>
    <button class="ft-tab" data-tab="more">More</button>
  </div>

  <div id="ft-content"><div class="ft-loading">Loading your checklist…</div></div>
</div>

<script>
(function () {
  'use strict';

  // ================= helpers =================
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function toISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fromISO(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function fmtLong(d) { return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }); }
  function fmtShort(d) { return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
  function monthLabel(d) { return d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }); }
  function startOfWeek(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() - d.getDay()); }
  // Retro-logging window: from the most recent Sunday up to today.
  function minLogDate() { return startOfWeek(new Date()); }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // ================= badge / metric definitions =================
  const lectureCount = (e) => typeof e.lecture === 'number' ? e.lecture : (e.lecture ? 1 : 0);
  const METRICS = [
    { key: 'predawn',    label: 'Predawn',                       badge: 'Morning star',             get: (e) => e.predawn ? 1 : 0 },
    { key: 'sunday',     label: 'Sunday message attendance',     badge: "Lord's glory",             get: (e) => e.sunday ? 1 : 0 },
    { key: 'wednesday',  label: 'Wednesday message attendance',  badge: 'Win and win again',        get: (e) => e.wednesday ? 1 : 0 },
    { key: 'bible',      label: 'Bible chapters',                badge: 'LifeScrolling',            get: (e) => e.bibleChapters || 0, daily: true },
    { key: 'exercise',   label: 'Exercise',                      badge: 'Strong body for the Lord', get: (e) => e.exercise ? 1 : 0 },
    { key: 'catchup',    label: 'Catch-ups',                     badge: 'Unshaken',                 get: (e) => (e.catchupSunday ? 1 : 0) + (e.catchupWednesday ? 1 : 0) },
    { key: 'diary',      label: 'Diary days',                    badge: 'Close to the Lord',        get: (e) => e.diary ? 1 : 0 },
    { key: 'letters',    label: 'Holy Spirit letters',           badge: 'Holy Spirit',              get: null, daily: true },
    { key: 'messages',   label: 'Message re-reads',              badge: 'Word of life',             get: (e) => (e.sundayReads || 0) + (e.wednesdayReads || 0), daily: true },
    { key: 'evangelism', label: 'People met or invited',         badge: 'Loving lives',             get: (e) => e.evangelism || 0, daily: true },
    { key: 'lecture',    label: 'Lectures',                      badge: 'Truth',                    get: lectureCount, daily: true },
  ];
  const badgeName = (m) => m.badge + ' badge';

  function aggregateList(list) {
    const a = {};
    METRICS.forEach((m) => {
      if (m.key === 'letters') {
        const s = new Set();
        list.forEach((e) => (e.letters || []).forEach((n) => s.add(n)));
        a.letters = s.size;
      } else {
        a[m.key] = list.reduce((sum, e) => sum + m.get(e), 0);
      }
    });
    a.custom = {};
    list.forEach((e) => {
      Object.keys(e.custom || {}).forEach((k) => { a.custom[k] = (a.custom[k] || 0) + (e.custom[k] || 0); });
    });
    return a;
  }

  function aggregateEntries(groupKeyFn) {
    const groups = {};
    Object.keys(data.entries).forEach((iso) => {
      const k = groupKeyFn(iso);
      if (!groups[k]) groups[k] = [];
      groups[k].push(data.entries[iso]);
    });
    const out = {};
    Object.keys(groups).forEach((k) => { out[k] = aggregateList(groups[k]); });
    return out;
  }

  function dayAggregates() {
    const out = {};
    Object.keys(data.entries).forEach((iso) => { out[iso] = aggregateList([data.entries[iso]]); });
    return out;
  }

  const PERIODS = {
    week: {
      keyOf: (iso) => toISO(startOfWeek(fromISO(iso))),
      shift: (d, n) => addDays(d, 7 * n),
      label: (k) => { const s = fromISO(k); return fmtShort(s) + ' – ' + fmtShort(addDays(s, 6)); },
    },
    month: {
      keyOf: (iso) => iso.slice(0, 7),
      shift: (d, n) => new Date(d.getFullYear(), d.getMonth() + n, 1),
      label: (k) => monthLabel(fromISO(k + '-01')),
    },
    year: {
      keyOf: (iso) => iso.slice(0, 4),
      shift: (d, n) => new Date(d.getFullYear() + n, 0, 1),
      label: (k) => k,
    },
  };

  // Adds a 0-100 "overall" score to each group, relative to the best value
  // seen for each metric in that same set.
  function addOverallScores(byGroup, metrics) {
    const maxes = {};
    metrics.forEach((m) => {
      let mx = 0;
      Object.keys(byGroup).forEach((k) => { if ((byGroup[k][m.key] || 0) > mx) mx = byGroup[k][m.key]; });
      maxes[m.key] = mx;
    });
    Object.keys(byGroup).forEach((k) => {
      let sum = 0, c = 0;
      metrics.forEach((m) => {
        if (maxes[m.key] > 0) { sum += ((byGroup[k][m.key] || 0) / maxes[m.key]) * 100; c++; }
      });
      byGroup[k].overall = c ? Math.round(sum / c) : 0;
    });
  }

  // ================= state =================
  let data = null;
  let currentUser = null;
  let activeTab = 'today';
  let viewDate = new Date();
  const anchors = { week: new Date(), month: new Date(), year: new Date() };
  let allGroups = [];
  let awardScope = 'all';
  let diaryKey = null;
  let reminderTimer = null;

  const root = document.getElementById('faith-tracker-root');
  const authRoot = document.getElementById('faith-auth-root');
  const content = document.getElementById('ft-content');
  const tabsEl = document.getElementById('ft-tabs');
  const headerSub = document.getElementById('ft-header-sub');
  const accountLabel = document.getElementById('ft-account-email');
  const nameInput = document.getElementById('ft-auth-name');
  const emailInput = document.getElementById('ft-auth-email');
  const passwordInput = document.getElementById('ft-auth-password');
  const authError = document.getElementById('ft-auth-error');

  // ================= firebase =================
  const cfg = window.FAITH_FIREBASE_CONFIG || {};
  if (!cfg.apiKey || String(cfg.apiKey).indexOf('YOUR_') === 0) {
    authError.textContent = 'This app is not connected to Firebase yet. Fill in firebase-config.js.';
  }
  firebase.initializeApp(cfg);
  const auth = firebase.auth();
  const db = firebase.firestore();
  db.enablePersistence({ synchronizeTabs: true }).catch(function () {});

  const LEGACY_KEY = 'faith-tracker-data';
  function userDocRef() { return db.collection('users').doc(currentUser.uid); }

  function defaultEntry() {
    return {
      sunday: false, predawn: false, wednesday: false,
      catchupSunday: false, catchupWednesday: false,
      bibleChapters: 0, sundayReads: 0, wednesdayReads: 0,
      letters: [], exercise: false, lecture: 0,
      evangelism: 0, diary: false
    };
  }
  function getEntry(iso) {
    if (!data.entries[iso]) data.entries[iso] = defaultEntry();
    return data.entries[iso];
  }

  function normalizeData() {
    if (!data.entries) data.entries = {};
    if (typeof data.letterMax !== 'number') data.letterMax = 170;
    if (!Array.isArray(data.groupIds)) data.groupIds = [];
  }

  async function loadData() {
    const snap = await userDocRef().get();
    if (snap.exists) {
      data = snap.data();
      normalizeData();
      return;
    }
    data = { entries: {}, letterMax: 170, groupIds: [], groupsSetupDone: false };
    const raw = localStorage.getItem(LEGACY_KEY);
    if (raw) {
      try {
        const legacy = JSON.parse(raw);
        if (legacy && legacy.entries && Object.keys(legacy.entries).length > 0 &&
            confirm('We found existing checklist data on this device. Import it into your new account?')) {
          data = legacy;
          data.groupsSetupDone = false;
          normalizeData();
        }
      } catch (e) { /* ignore */ }
    }
    await userDocRef().set(data);
  }

  let saveTimer = null;
  function saveData() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      userDocRef().set(data).catch(function (e) { console.error('Save failed', e); });
      updateLeaderboard(toISO(viewDate));

  // ================= leaderboard =================
  function periodStats(type, iso) {
    const cfgP = PERIODS[type];
    const key = cfgP.keyOf(iso);
    const agg = aggregateEntries(cfgP.keyOf)[key] || aggregateList([]);
    return { key: key, agg: agg };
  }

  async function updateLeaderboard(iso) {
    if (!currentUser || !data) return;
    const displayName = currentUser.displayName || (currentUser.email ? currentUser.email.split('@')[0] : 'Member');
    try {
      const batch = db.batch();
      ['week', 'month', 'year'].forEach(function (type) {
        const s = periodStats(type, iso);
        const row = Object.assign({}, s.agg, {
          custom: validCustom(s.agg.custom),
          uid: currentUser.uid,
          displayName: displayName,
          periodType: type,
          periodKey: s.key,
          groupIds: data.groupIds || [],
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        batch.set(db.collection('leaderboard').doc(type + '_' + s.key + '_' + currentUser.uid), row);
      });
      await batch.commit();
    } catch (e) { console.error('Leaderboard update failed', e); }
  }

  function validCustom(c) {
    const ok = {};
    myGroupList().forEach((g) => (g.items || []).forEach((it) => { ok[g.id + '__' + it.id] = true; }));
    const out = {};
    Object.keys(c || {}).forEach((k) => { if (ok[k]) out[k] = c[k]; });
    return out;
  }

  // Standard badges plus any custom badges the given group has added.
  function scopeMetrics(scopeId) {
    const g = allGroups.filter((x) => x.id === scopeId)[0];
    const extra = g ? (g.items || []).map((it) => ({
      key: 'c:' + g.id + '__' + it.id, custom: g.id + '__' + it.id,
      label: it.label, badge: it.badge, groupBadge: true
    })) : [];
    return METRICS.concat(extra);
  }
  const valueOf = (r, m) => m.custom ? ((r.custom || {})[m.custom] || 0) : (r[m.key] || 0);

  async function fetchLeaderboard(type, key) {
    try {
      const snap = await db.collection('leaderboard')
        .where('periodType', '==', type).where('periodKey', '==', key).get();
      return snap.docs.map(function (d) { return d.data(); });
    } catch (e) {
      console.error('Leaderboard fetch failed', e);
      return [];
    }
  }

  function computeAwards(rows, metrics) {
    const maxes = {}, byMetric = {}, badgeCount = {};
    metrics.forEach(function (m) {
      let mx = 0;
      rows.forEach(function (r) { if (valueOf(r, m) > mx) mx = valueOf(r, m); });
      maxes[m.key] = mx;
      const winners = mx > 0 ? rows.filter(function (r) { return valueOf(r, m) === mx; }) : [];
      byMetric[m.key] = { max: mx, winners: winners };
      winners.forEach(function (w) { badgeCount[w.uid] = (badgeCount[w.uid] || 0) + 1; });
    });
    const ranked = rows.map(function (r) {
      let sum = 0, c = 0;
      metrics.forEach(function (m) {
        if (maxes[m.key] > 0) { sum += (valueOf(r, m) / maxes[m.key]) * 100; c++; }
      });
      return { row: r, badges: badgeCount[r.uid] || 0, score: c ? Math.round(sum / c) : 0 };
    }).sort(function (a, b) { return b.badges - a.badges || b.score - a.score; });
    return { ranked: ranked, byMetric: byMetric };
  }

  async function renderAwards(container, type, key, isFinal) {
    container.innerHTML = '';

    if (!container.isConnected) return;
    const groups = myGroupList();
    if (awardScope !== 'all' && !groups.some(function (g) { return g.id === awardScope; })) awardScope = 'all';

    function draw() {
      container.innerHTML = '';
      const scopes = [{ id: 'all', name: 'Everyone' }].concat(groups);
      if (scopes.length > 1) {
        const pills = el('div', 'ft-pills');
        scopes.forEach(function (s) {
          const b = el('button', 'ft-pill' + (s.id === awardScope ? ' active' : ''), s.name);

      }
      const scopeRows = awardScope === 'all' ? rows : rows.filter(function (r) { return (r.groupIds || []).indexOf(awardScope) !== -1; });
      const scopeName = (scopes.filter(function (s) { return s.id === awardScope; })[0] || scopes[0]).name;
      if (!scopeRows.length) {
        container.appendChild(el('div', 'ft-empty', 'No one has logged anything for this period yet.'));
        return;
      }
      const metrics = scopeMetrics(awardScope);
      const res = computeAwards(scopeRows, metrics);
      const top = res.ranked[0];
      const head = el('div', 'ft-champion' + (top.row.uid === currentUser.uid ? ' ft-champ-leading' : ''));
      head.appendChild(el('span', 'ft-champ-cat', (isFinal ? 'Winner' : 'Leading') + ' · ' + scopeName));
      if (top.badges === 0) {
        head.appendChild(el('div', '', 'No badges won yet.'));
      } else {
        const tied = res.ranked.filter(function (x) { return x.badges === top.badges && x.score === top.score; });
        head.appendChild(el('div', '', tied.map(function (x) { return x.row.displayName || 'Member'; }).join(' & ') +
          ' with ' + top.badges + (top.badges === 1 ? ' badge' : ' badges')));

      const myIdx = res.ranked.findIndex(function (x) { return x.row.uid === currentUser.uid; });
      if (myIdx >= 5) {
        const r = rankRow(myIdx + 1, res.ranked[myIdx]);
        r.style.borderTop = '1px dashed var(--line)';
        list.appendChild(r);
      }
      container.appendChild(list);
      container.appendChild(el('div', 'ft-note', 'Ties on badges are broken by overall average.'));

      container.appendChild(el('p', 'ft-section-title', 'Badges'));
      const bl = el('div', 'ft-section');
      let mine = 0;
      metrics.forEach(function (m) {
        const info = res.byMetric[m.key];
        const isMine = info.winners.some(function (w) { return w.uid === currentUser.uid; });
        if (isMine) mine++;
        const row = el('div', 'ft-badge-row' + (isMine ? ' mine' : ''));
        row.appendChild(el('span', 'ft-badge-name', badgeName(m) + (m.groupBadge ? ' · group badge' : '')));
        row.appendChild(el('span', 'ft-badge-winner',
          info.winners.length
            ? m.label + ' · ' + info.winners.map(function (w) { return (w.displayName || 'Member') + (w.uid === currentUser.uid ? ' (you)' : ''); }).join(', ') + ' · ' + info.max
            : m.label + ' · not won yet'));
        bl.appendChild(row);
      });
      container.appendChild(bl);
      container.appendChild(el('div', 'ft-note', 'You hold ' + mine + ' of ' + metrics.length + ' badges here.'));
    }
    draw();
  }

  function slugify(name) {
    const s = name.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    if (s) return s.slice(0, 60);
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
    return 'g-' + Math.abs(h);
  }

  // ================= private diary (end-to-end encrypted) =================
  const TE = new TextEncoder(), TD = new TextDecoder();
  function b64(buf) {
    const bytes = new Uint8Array(buf);
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function unb64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  async function deriveKey(pass, saltB64) {
    const base = await crypto.subtle.importKey('raw', TE.encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: unb64(saltB64), iterations: 250000, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function encryptText(key, text) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, TE.encode(text));
    return { iv: b64(iv), ct: b64(ct) };
  }
  async function decryptText(key, obj) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(obj.iv) }, key, unb64(obj.ct));
    return TD.decode(pt);
  }
  const DIARY_CHECK = 'faith-diary-ok';

  // Shows a set-up or unlock form until the diary key is available.
  function diaryGate(container, onReady) {
    if (diaryKey) { onReady(); return; }
    container.innerHTML = '';
    const msg = el('div', 'ft-msg');
    if (!data.diaryCrypto) {
      container.appendChild(el('div', 'ft-note', 'Your diary is private. It is encrypted on your device with a passphrase only you know, so nobody else, including the person who runs this app, can read it. Any diary text you already wrote will be encrypted too.'));
      container.appendChild(el('div', 'ft-note', 'If you forget this passphrase your diary cannot be recovered. It is separate from your login password.'));
      const p1 = el('input', 'ft-text'); p1.type = 'password'; p1.placeholder = 'Choose a diary passphrase (8+ characters)'; p1.autocomplete = 'new-password';
      const p2 = el('input', 'ft-text'); p2.type = 'password'; p2.placeholder = 'Confirm passphrase'; p2.autocomplete = 'new-password';
      const btn = el('button', 'ft-btn primary', 'Set diary passphrase');
      btn.type = 'button';
      btn.addEventListener('click', async function () {
        msg.textContent = '';
        if (p1.value.length < 8) { msg.textContent = 'Use at least 8 characters.'; return; }
        if (p1.value !== p2.value) { msg.textContent = 'The two passphrases do not match.'; return; }
        btn.disabled = true;
        try {
          const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
          const key = await deriveKey(p1.value, salt);
          const check = await encryptText(key, DIARY_CHECK);
          const isos = Object.keys(data.entries);
          for (let i = 0; i < isos.length; i++) {
            const e = data.entries[isos[i]];
            if (e.diaryText) { e.diaryEnc = await encryptText(key, e.diaryText); delete e.diaryText; }
          }
          data.diaryCrypto = { salt: salt, check: check };
          diaryKey = key;
          saveData();
          onReady();
        } catch (e) { msg.textContent = 'Could not set up encryption on this device.'; btn.disabled = false; }
      });
      const st = el('div', 'ft-stack');
      st.appendChild(p1); st.appendChild(p2); st.appendChild(btn);
      container.appendChild(st);
    } else {
      const p = el('input', 'ft-text'); p.type = 'password'; p.placeholder = 'Diary passphrase'; p.autocomplete = 'current-password';
      const btn = el('button', 'ft-btn primary', 'Unlock diary');
      btn.type = 'button';
      const go = async function () {
        msg.textContent = '';
        btn.disabled = true;
        try {
          const key = await deriveKey(p.value, data.diaryCrypto.salt);
          const check = await decryptText(key, data.diaryCrypto.check);
          if (check !== DIARY_CHECK) throw new Error('bad');
          diaryKey = key;
          onReady();
        } catch (e) { msg.textContent = 'That passphrase is not correct.'; btn.disabled = false; }
      };
      btn.addEventListener('click', go);
      p.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go(); });
      const st = el('div', 'ft-stack');
      st.appendChild(p); st.appendChild(btn);
      container.appendChild(st);
    }
    container.appendChild(msg);
  }

    let shown = false;
    metrics.concat([{ key: 'overall', label: 'Overall average', badge: null }]).forEach(function (m) {
      let bestKey = null, bestVal = 0;
      keys.forEach(function (k) {
        const v = byGroup[k][m.key] || 0;
        if (v > bestVal || (v === bestVal && v > 0 && k === selectedKey)) { bestVal = v; bestKey = k; }
      });
      if (!bestKey) return;
      shown = true;
      const isSel = bestKey === selectedKey;
      const div = el('div', 'ft-champion' + (isSel ? ' ft-champ-leading' : ''));
      div.appendChild(el('span', 'ft-champ-cat', m.badge ? badgeName(m) + ' · ' + m.label : m.label));
      div.appendChild(el('div', '', formatKey(bestKey) + ' is your best with ' + bestVal + (isSel ? ' — this is it' : '')));
      container.appendChild(div);
    });
    if (!shown) container.appendChild(el('div', 'ft-empty', emptyMsg));
  }

  function render() {
    headerSub.textContent = fmtLong(new Date());
    if (activeTab === 'today') renderToday();
    else if (activeTab === 'more') renderMore();
    else renderPeriod(activeTab);
  }

  function renderToday() {
    content.innerHTML = '';
    const iso = toISO(viewDate);
    const entry = getEntry(iso);
    const dow = viewDate.getDay();
    const canPrev = iso > toISO(minLogDate());
    const canNext = iso < toISO(new Date());
    content.appendChild(navBar(fmtLong(viewDate), canPrev, canNext,
      function () { viewDate = addDays(viewDate, -1); render(); },
      function () { viewDate = addDays(viewDate, 1); render(); }));

    const upd = function (fn) { return function (v) { fn(v); saveData(); render(); }; };

    let s = section('Attendance');
    if (dow === 0) s.appendChild(checkRow('Sunday message', null, entry.sunday, upd(function (v) { entry.sunday = v; })));
    s.appendChild(checkRow('Predawn', null, entry.predawn, upd(function (v) { entry.predawn = v; })));
    if (dow === 3) s.appendChild(checkRow('Wednesday message', null, entry.wednesday, upd(function (v) { entry.wednesday = v; })));
    s.appendChild(el('div', 'ft-row-hint', 'Once connected to the attendance bot, this will fill in automatically from the logs.'));

    s = section('Catch up if missed');
    s.appendChild(checkRow('Caught up on Sunday message', null, entry.catchupSunday, upd(function (v) { entry.catchupSunday = v; })));
    s.appendChild(checkRow('Caught up on Wednesday message', null, entry.catchupWednesday, upd(function (v) { entry.catchupWednesday = v; })));

    s = section('Reading');
    s.appendChild(stepRow('Bible chapters read', null, entry.bibleChapters || 0, upd(function (v) { entry.bibleChapters = v; })));
    s.appendChild(stepRow('Sunday message re-reads', 'The more times the better', entry.sundayReads || 0, upd(function (v) { entry.sundayReads = v; })));
    s.appendChild(stepRow('Wednesday message re-reads', 'The more times the better', entry.wednesdayReads || 0, upd(function (v) { entry.wednesdayReads = v; })));

    s = section('Story of the Holy Spirit letter');
    const lr = el('div', 'ft-row');
    const llw = el('div', 'ft-row-label', 'Letter numbers read today');
    llw.appendChild(el('span', 'ft-row-hint', 'e.g. 168, 169, 170'));
    const li = el('input', 'ft-text');
    li.type = 'text'; li.style.width = '110px';
    li.value = (entry.letters || []).join(', ');
    li.addEventListener('change', function () {
      const nums = li.value.split(',').map(function (x) { return parseInt(x.trim(), 10); }).filter(function (n) { return !isNaN(n) && n > 0; });
      entry.letters = Array.from(new Set(nums));
      saveData(); render();
    });
    lr.appendChild(llw); lr.appendChild(li);
    s.appendChild(lr);
    const readSet = new Set();
    Object.keys(data.entries).forEach(function (k) { (data.entries[k].letters || []).forEach(function (n) { readSet.add(n); }); });
    const pw = el('div', 'ft-progress-wrap');
    const bar = el('div', 'ft-progress-bar');
    bar.style.width = Math.min(100, Math.round(readSet.size / (data.letterMax || 170) * 100)) + '%';
    pw.appendChild(bar);
    s.appendChild(pw);
    s.appendChild(el('div', 'ft-progress-label', readSet.size + ' of ' + data.letterMax + ' letters read overall'));
    const sl = el('div', 'ft-settings-line');
    sl.appendChild(el('span', '', 'Latest letter number posted'));
    const si = el('input'); si.type = 'number'; si.min = 1; si.value = data.letterMax;
    si.addEventListener('change', function () { data.letterMax = Math.max(1, parseInt(si.value, 10) || data.letterMax); saveData(); render(); });
    sl.appendChild(si);
    s.appendChild(sl);

    s = section('Practice');
    s.appendChild(checkRow('Exercise', null, entry.exercise, upd(function (v) { entry.exercise = v; })));
    s.appendChild(stepRow('Lectures attended', null, lectureCount(entry), upd(function (v) { entry.lecture = v; })));

    s = section('Evangelism');
    s.appendChild(stepRow('People met or invited', null, entry.evangelism || 0, upd(function (v) { entry.evangelism = v; })));

    s = section('My Diary today');
    const dl = el('div', 'ft-row-label', 'Dear Lord');
    dl.style.marginBottom = '6px';
    s.appendChild(dl);
    if (!diaryKey) {
      const gate = el('div');
      s.appendChild(gate);
      diaryGate(gate, render);
    } else {
      const ta = el('textarea', 'ft-text');
      ta.placeholder = "Write today's diary entry…";
      ta.style.marginBottom = '4px';
      if (entry.diaryEnc) {
        decryptText(diaryKey, entry.diaryEnc).then(function (t) { ta.value = t; }).catch(function () { ta.value = ''; ta.placeholder = '(this entry could not be decrypted)'; });
      }
      ta.addEventListener('change', async function () {
        const t = ta.value;
        if (t.trim()) entry.diaryEnc = await encryptText(diaryKey, t); else delete entry.diaryEnc;
        delete entry.diaryText;
        saveData();
      });
      s.appendChild(ta);
      const lock = el('button', 'ft-link', 'Lock diary');
      lock.type = 'button';
      lock.addEventListener('click', function () { diaryKey = null; render(); });
      s.appendChild(lock);
    }
    s.appendChild(checkRow('Write Diary', null, entry.diary, upd(function (v) { entry.diary = v; })));

    myGroupList().forEach(function (g) {
      if (!g.items.length) return;
      const gs = section(g.name);
      if (!entry.custom) entry.custom = {};
      g.items.forEach(function (it) {
        const ck = g.id + '__' + it.id;
        const cur = entry.custom[ck] || 0;
        const set = function (v) { entry.custom[ck] = v; };
        if (it.type === 'count') gs.appendChild(stepRow(it.label, badgeName(it), cur, upd(set)));
        else gs.appendChild(checkRow(it.label, badgeName(it), !!cur, upd(function (v) { set(v ? 1 : 0); })));
      });
    });

    s = section('Milestones');
    const daily = METRICS.filter(function (m) { return m.daily; });
    const byDay = dayAggregates();
    addOverallScores(byDay, daily);
    renderChampions(s, byDay, daily, iso, function (k) { return fmtLong(fromISO(k)); }, 'Log a day to start seeing daily milestones here.');
  }

  function renderPeriod(type) {
    content.innerHTML = '';
    const P = PERIODS[type];
    const anchor = anchors[type];
    const key = P.keyOf(toISO(anchor));
    const curKey = P.keyOf(toISO(new Date()));
    content.appendChild(navBar(P.label(key), true, key < curKey,
      function () { anchors[type] = P.shift(anchor, -1); render(); },
      function () { anchors[type] = P.shift(anchor, 1); render(); }));

    const byGroup = aggregateEntries(P.keyOf);
    const agg = byGroup[key] || aggregateList([]);

    let s = section('Totals');
    const grid = el('div', 'ft-stat-grid');
    METRICS.forEach(function (m) {
      const st = el('div', 'ft-stat');
      st.appendChild(el('div', 'ft-stat-num', String(agg[m.key] || 0)));
      st.appendChild(el('div', 'ft-stat-label', m.label));
      grid.appendChild(st);
    });
    s.appendChild(grid);

    myGroupList().forEach(function (g) {
      if (!g.items.length) return;
      const gs = section(g.name);
      const gg = el('div', 'ft-stat-grid');
      g.items.forEach(function (it) {
        const ck = g.id + '__' + it.id;
        const st = el('div', 'ft-stat');
        st.appendChild(el('div', 'ft-stat-num', String((agg.custom || {})[ck] || 0)));
        st.appendChild(el('div', 'ft-stat-label', it.label));
        gg.appendChild(st);
      });
      gs.appendChild(gg);
    });

    s = section('Your milestones');
    addOverallScores(byGroup, METRICS);
    renderChampions(s, byGroup, METRICS, key, P.label, 'Log a few days to start seeing milestones here.');

    const isFinal = key < curKey;
    s = section(isFinal ? 'Awards · final' : 'Awards · standings so far');
    renderAwards(s, type, key, isFinal);
  }

  function renderMore() {
    content.innerHTML = '';
    let s = section('My groups');
    renderGroupsPanel(s, false);

    s = section('Diary history');
    renderDiaryHistory(s);

    s = section('Backup');
    s.appendChild(el('div', 'ft-note', 'Your data is saved to your account automatically. A backup file is an extra safety copy (diary entries stay encrypted in it).'));
    const row = el('div', 'ft-inline');
    const ex = el('button', 'ft-btn', 'Back up data'); ex.type = 'button';
    ex.addEventListener('click', exportData);
    const im = el('button', 'ft-btn', 'Restore backup'); im.type = 'button';
    const file = el('input'); file.type = 'file'; file.accept = 'application/json'; file.style.display = 'none';
    im.addEventListener('click', function () { file.click(); });
    file.addEventListener('change', function () { if (file.files && file.files[0]) importData(file.files[0]); file.value = ''; });
    row.appendChild(ex); row.appendChild(im); row.appendChild(file);
    s.appendChild(row);

    s = section('Reminder');
    const rb = el('button', 'ft-btn', '');
    rb.type = 'button';
    s.appendChild(rb);
    setupReminderButton(rb);
  }

  // ================= backup =================
  function exportData() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'faith-checklist-backup-' + toISO(new Date()) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  }
  function importData(file) {
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed.entries) throw new Error('Invalid file');
        parsed.groupIds = Array.isArray(parsed.groupIds) ? parsed.groupIds : data.groupIds;
        parsed.groupsSetupDone = true;
        data = parsed;
        normalizeData();
        diaryKey = null;
        saveData();
        render();
        alert('Backup restored.');
      } catch (e) {
        alert("Could not read that file. Make sure it's a backup exported from this app.");
      }
    };
    reader.readAsText(file);
  }

  // ================= 8 PM reminder =================
  const REMINDER_KEY = 'faith-tracker-reminder-enabled';
  function msUntilNext8pm() {
    const now = new Date();
    const t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 20, 0, 0, 0);
    if (t.getTime() <= now.getTime()) t.setDate(t.getDate() + 1);
    return t.getTime() - now.getTime();
  }
  async function fireReminder() {
    const body = "Don't forget to log today's faith checklist.";
    try {
      if ('serviceWorker' in navigator) {
        const reg = await navigator.serviceWorker.ready;
        reg.showNotification('Faith Checklist', { body: body, icon: 'icon-192.png', badge: 'icon-192.png' });
      } else if (Notification.permission === 'granted') {
        new Notification('Faith Checklist', { body: body });
      }
    } catch (e) { /* ignore */ }
  }
  function scheduleReminder() {
    clearTimeout(reminderTimer);
    reminderTimer = setTimeout(function () { fireReminder(); scheduleReminder(); }, msUntilNext8pm());
  }
  function reminderOn() {
    return 'Notification' in window && localStorage.getItem(REMINDER_KEY) === 'true' && Notification.permission === 'granted';
  }
  function setupReminderButton(btn) {
    if (!('Notification' in window)) { btn.textContent = 'Reminders are not supported in this browser'; btn.disabled = true; return; }
    const paint = function () { btn.textContent = reminderOn() ? 'Daily 8 PM reminder is on (tap to turn off)' : 'Enable 8 PM daily reminder'; };
    paint();
    btn.addEventListener('click', async function () {
      if (reminderOn()) {
        localStorage.setItem(REMINDER_KEY, 'false');
        clearTimeout(reminderTimer);
      } else {
        const perm = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
        if (perm === 'granted') { localStorage.setItem(REMINDER_KEY, 'true'); scheduleReminder(); }
        else alert("Notifications weren't allowed. You can allow them in your browser or phone settings and try again.");
      }
      paint();
    });
  }

  // ================= auth =================
  function authErrorMessage(err) {
    const code = err && err.code;
    if (code === 'auth/invalid-email') return 'That email address looks invalid.';
    if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') return 'Incorrect email or password.';
    if (code === 'auth/email-already-in-use') return 'An account already exists with that email. Try logging in instead.';
    if (code === 'auth/weak-password') return 'Please use a password with at least 6 characters.';
    return (err && err.message) || 'Something went wrong. Please try again.';
  }

  document.getElementById('ft-auth-login-btn').addEventListener('click', async function () {
    authError.textContent = '';
    try { await auth.signInWithEmailAndPassword(emailInput.value.trim(), passwordInput.value); }
    catch (e) { authError.textContent = authErrorMessage(e); }
  });
  document.getElementById('ft-auth-signup-btn').addEventListener('click', async function () {
    authError.textContent = '';
    const name = nameInput.value.trim();
    if (!name) { authError.textContent = "Please enter a display name. It's what others will see on the leaderboard."; return; }
    try {
      const cred = await auth.createUserWithEmailAndPassword(emailInput.value.trim(), passwordInput.value);
      await cred.user.updateProfile({ displayName: name });
      if (currentUser) renderAccountLabel();
    } catch (e) { authError.textContent = authErrorMessage(e); }
  });
  document.getElementById('ft-auth-reset-btn').addEventListener('click', async function () {
    authError.textContent = '';
    const email = emailInput.value.trim();
    if (!email) { authError.textContent = 'Enter your email above first, then tap this again.'; return; }
    try { await auth.sendPasswordResetEmail(email); authError.textContent = 'Password reset email sent.'; }
    catch (e) { authError.textContent = authErrorMessage(e); }
  });
  document.getElementById('ft-logout-btn').addEventListener('click', function () {
    clearTimeout(reminderTimer);
    diaryKey = null;
    auth.signOut();
  });

  function renderAccountLabel() {
    accountLabel.innerHTML = '';
    if (currentUser.displayName) { accountLabel.textContent = currentUser.displayName; return; }
    const span = el('span', '', 'No display name set — ');
    const link = el('a', '', 'add one for the leaderboard');
    link.href = '#';
    link.style.color = 'var(--accent)';
    link.addEventListener('click', async function (e) {
      e.preventDefault();
      const name = prompt('Display name (shown on the leaderboard):');
      if (name && name.trim()) {
        await currentUser.updateProfile({ displayName: name.trim() });
        renderAccountLabel();
        updateLeaderboard(toISO(new Date()));
      }
    });
    span.appendChild(link);
    accountLabel.appendChild(span);
  }

  function enterApp() {
    tabsEl.style.display = '';
    renderAccountLabel();
    render();
    if (reminderOn()) scheduleReminder();
  }

  tabsEl.querySelectorAll('.ft-tab').forEach(function (btn) {
    btn.addEventListener('click', function () {
      tabsEl.querySelectorAll('.ft-tab').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      activeTab = btn.dataset.tab;
      render();
    });
  });

  auth.onAuthStateChanged(async function (user) {
    currentUser = user;
    if (!user) {
      root.style.display = 'none';
      authRoot.style.display = '';
      data = null;
      diaryKey = null;
      return;
    }
    authRoot.style.display = 'none';
    root.style.display = '';
    nameInput.value = ''; emailInput.value = ''; passwordInput.value = ''; authError.textContent = '';
    content.innerHTML = '<div class="ft-loading">Loading your checklist…</div>';
    await loadData();
    try { await loadGroups(); } catch (e) { console.error('Could not load groups', e); }
    renderAccountLabel();
    if (!data.groupsSetupDone) renderOnboarding();
    else enterApp();
  });
})();

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
